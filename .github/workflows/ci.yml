name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint · tests · eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Tests (pytest)
        run: pytest -q
      - name: Eval harness smoke (offline, mock providers)
        run: python -m app.eval.runner

  backend-postgres:
    name: Backend · Postgres portability
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lensrag
          POSTGRES_PASSWORD: lensrag
          POSTGRES_DB: lensrag
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U lensrag"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      LENSRAG_DATABASE_URL: postgresql+asyncpg://lensrag:lensrag@localhost:5432/lensrag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install (with asyncpg)
        run: pip install -e ".[dev,postgres]"
      - name: Tests against Postgres
        run: pytest -q

  frontend:
    name: Frontend · lint · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Lint (next lint)
        run: npm run lint
      - name: Build (next build)
        run: npm run build
