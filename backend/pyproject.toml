[project]
name = "lensrag"
version = "0.1.0"
description = "LensRAG backend — multimodal RAG that reads charts/tables in documents."
requires-python = ">=3.12"

# Base dependencies are intentionally LIGHT so the API, tests and CI run with no
# multi-gigabyte model downloads. The heavy, frontier pieces (real Gemini VLM and
# ColPali visual retrieval) are optional extras that plug in on cloud GPU hosts.
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",          # default local/dev database driver (SQLite)
    "greenlet>=3.0",            # required by SQLAlchemy async
    "pymupdf>=1.24",            # render PDF pages to images + extract text
    "pillow>=10.3",             # image handling for cited-region crops
    "numpy>=1.26",              # cosine similarity for the in-memory vector index
    "httpx>=0.27",              # calls the Gemini REST API (no heavy SDK needed)
    "python-multipart>=0.0.9",  # multipart/form-data file uploads
]

[project.optional-dependencies]
# Production database driver + pgvector-backed vector index.
postgres = ["asyncpg>=0.29", "pgvector>=0.3"]
# Real semantic text embeddings (BAAI/bge-small). ~heavy: torch + transformers.
bge = ["sentence-transformers>=3.0"]
# Real ColPali / ColQwen2 late-interaction visual retrieval. GPU recommended.
colpali = ["colpali-engine>=0.3", "torch>=2.3", "transformers>=4.44"]
# Regenerate the synthetic eval corpus (charts/tables with known ground truth).
corpus = ["matplotlib>=3.8"]
# Test + lint tooling.
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Only the importable package — keeps editable installs off tests/, data/, etc.
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI uses function calls (Depends(...)) in argument defaults

[tool.ruff.lint.per-file-ignores]
"scripts/corpus_data.py" = ["E501"]  # hand-authored data rows; line length isn't meaningful

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]  # so `import app` resolves when running pytest from backend/
filterwarnings = ["ignore::DeprecationWarning"]
